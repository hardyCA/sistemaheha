<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <!-- Firebase Firestore (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script defer src="app.js"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-white text-2xl font-bold">Gestión de Restaurante</a>
            <div class="flex sm:hidden">
                <button id="menuButton" class="text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
            <div id="navMenu" class="hidden sm:flex sm:space-x-4">
                <a href="#ingredientsSection" class="text-white hover:text-gray-300 block sm:inline">Ingredientes</a>
                <a href="#dishesSection" class="text-white hover:text-gray-300 block sm:inline">Platillos</a>
                <a href="#salesSection" class="text-white hover:text-gray-300 block sm:inline">Ventas</a>
                <a href="#reportSection" class="text-white hover:text-gray-300 block sm:inline">Reporte Diario</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <!-- Sección de Ingredientes -->
        <section id="ingredientsSection" class="mt-8">
            <h2 class="text-3xl font-bold text-blue-600 mb-4">Gestión de Ingredientes</h2>
            <form id="ingredientForm" class="bg-white p-6 rounded shadow-md">
                <h3 class="text-xl font-semibold mb-4 text-blue-500">Registrar Ingrediente</h3>
                <input type="text" id="nombre" placeholder="Nombre" class="block w-full p-2 border rounded mb-4">
                <input type="number" id="precioCompra" placeholder="Precio de Compra" class="block w-full p-2 border rounded mb-4">
                <input type="text" id="unidad" placeholder="Unidad" class="block w-full p-2 border rounded mb-4">
                <input type="number" id="porciones" placeholder="Porciones" class="block w-full p-2 border rounded mb-4">
                <button type="submit" id="submitButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Registrar</button>
            </form>
            <ul id="ingredientList" class="mt-8"></ul>
        </section>

        <!-- Sección de Platillos -->
        <section id="dishesSection" class="mt-8 hidden">
            <h2 class="text-3xl font-bold text-blue-600 mb-4">Gestión de Platillos</h2>
            <form id="dishForm" class="bg-white p-6 rounded shadow-md">
                <h3 class="text-xl font-semibold mb-4 text-blue-500">Registrar Platillo</h3>
                <input type="text" id="nombrePlatillo" placeholder="Nombre del Platillo" class="block w-full p-2 border rounded mb-4">
                <input type="number" id="precioVenta" placeholder="Precio de Venta" class="block w-full p-2 border rounded mb-4">
                <div id="ingredientsList" class="mt-4"></div>
                <button type="submit" id="submitButtonPlatillo" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Registrar Platillo</button>
            </form>
            <ul id="dishList" class="mt-8"></ul>
        </section>

        <!-- Sección de Ventas -->
        <section id="salesSection" class="mt-8 hidden">
            <h2 class="text-3xl font-bold text-blue-600 mb-4">Registro de Ventas</h2>
            <form id="saleForm" class="bg-white p-6 rounded shadow-md">
                <h3 class="text-xl font-semibold mb-4 text-blue-500">Registrar Venta</h3>
                <div id="dishesList" class="mt-4"></div>
                <button type="submit" id="submitButtonSale" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Registrar Venta</button>
            </form>
            <ul id="salesList" class="mt-8"></ul>
        </section>

        <!-- Sección de Reporte Diario -->
        <section id="reportSection" class="mt-8 hidden">
            <h2 class="text-3xl font-bold text-blue-600 mb-4">Reporte Diario</h2>
            <div id="reportContent" class="bg-white p-6 rounded shadow-md"></div>
        </section>
    </div>

    <script>
        // Mostrar solo la sección activa
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function() {
                const targetId = this.getAttribute('href').substring(1);
                document.querySelectorAll('section').forEach(section => {
                    if (section.id === targetId) {
                        section.classList.remove('hidden');
                    } else {
                        section.classList.add('hidden');
                    }
                });
            });
        });

        // Mostrar por defecto la sección de ingredientes
        document.getElementById('ingredientsSection').classList.remove('hidden');

        // Alternar la visibilidad del menú en dispositivos pequeños
        document.getElementById('menuButton').addEventListener('click', function() {
            const navMenu = document.getElementById('navMenu');
            navMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
