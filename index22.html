<!DOCTYPE html>
<html>
<head>
    <title>Bingo Animado</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 48px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: bounce 1s ease infinite;
        }

        .number-display {
            font-size: 150px;
            font-weight: bold;
            margin: 20px;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            color: #2a5298;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .number-display.pop {
            animation: popIn 0.5s ease-out;
        }

        .number-display::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.8) 50%, transparent 60%);
            animation: shine 3s infinite;
        }

        .controls {
            margin: 30px;
            display: flex;
            gap: 20px;
        }

        button {
            font-size: 24px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #FF512F 0%, #F09819 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .numbers-called {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            margin-top: 20px;
            font-size: 18px;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .numbers-called span {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f0f;
            animation: fall 3s linear forwards;
            z-index: 1000;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>🎯 BINGO 🎲</h1>
    <div class="number-display">--</div>
    <div class="controls">
        <button onclick="generateNumber()">Nuevo Número</button>
        <button onclick="resetGame()">Reiniciar</button>
    </div>
    <div class="numbers-called">
        Números llamados: <div id="called-numbers"></div>
    </div>

    <script>
        let availableNumbers = [];
        let calledNumbers = [];

        function initializeGame() {
            availableNumbers = Array.from({length: 90}, (_, i) => i + 1);
            calledNumbers = [];
            updateDisplay('--');
            updateCalledNumbers();
            clearConfetti();
        }

        function generateNumber() {
            if (availableNumbers.length === 0) {
                alert('¡Todos los números han sido llamados!');
                createConfetti(100);
                return;
            }
            
            const numberDisplay = document.querySelector('.number-display');
            numberDisplay.classList.remove('pop');
            
            // Forzar un reflow
            void numberDisplay.offsetWidth;
            
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const number = availableNumbers.splice(randomIndex, 1)[0];
            calledNumbers.push(number);
            
            // Agregar animación
            numberDisplay.classList.add('pop');
            
            updateDisplay(number);
            updateCalledNumbers();
            createConfetti(20);
        }

        function updateDisplay(number) {
            document.querySelector('.number-display').textContent = number;
        }

        function updateCalledNumbers() {
            const calledNumbersElement = document.getElementById('called-numbers');
            calledNumbersElement.innerHTML = '';
            
            calledNumbers.sort((a, b) => a - b).forEach(number => {
                const span = document.createElement('span');
                span.textContent = number;
                calledNumbersElement.appendChild(span);
            });
        }

        function createConfetti(amount) {
            for (let i = 0; i < amount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // Posición aleatoria
                confetti.style.left = Math.random() * 100 + 'vw';
                
                // Color aleatorio
                const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Tamaño aleatorio
                const size = Math.random() * 10 + 5;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                
                document.body.appendChild(confetti);
                
                // Eliminar después de la animación
                confetti.addEventListener('animationend', () => {
                    confetti.remove();
                });
            }
        }

        function clearConfetti() {
            const confettis = document.querySelectorAll('.confetti');
            confettis.forEach(c => c.remove());
        }

        function resetGame() {
            const numberDisplay = document.querySelector('.number-display');
            numberDisplay.style.animation = 'none';
            void numberDisplay.offsetWidth;
            numberDisplay.style.animation = '';
            
            initializeGame();
            createConfetti(50);
        }

        // Inicializar el juego cuando carga la página
        initializeGame();
    </script>
</body>
</html>
